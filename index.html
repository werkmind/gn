<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Double Dash">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Double Dash · Game Night</title>
<style>
  :root {
    /* the GameCube's indigo shell */
    --bg:#3b2f93; --shell:#4a3cb0; --shell-hi:#6253d0; --panel:rgba(0,0,0,.22); --line:rgba(255,255,255,.18); --fg:#f4f2ff; --muted:#c3bdf0;
    --a:#16a34a; --b:#e23b3b; --xy:#d8d8e0; --z:#6c5ce7; --grey:#bdbdc8;
    --p1:#e0453a; --p2:#3a7be0; --p3:#2fbf55; --p4:#f0b429;
    /* the shorter side of the screen: everything on the pad scales with it */
    --s: min(100dvw, 100dvh);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:700 16px/1.25 "Arial Rounded MT Bold", ui-rounded, -apple-system, system-ui, sans-serif; overflow:hidden; overscroll-behavior:none; }
  body { background:radial-gradient(120% 90% at 50% 0%, var(--shell-hi), var(--shell) 45%, var(--bg)); }
  body { position:fixed; inset:0; touch-action:none; }
  .screen { position:absolute; inset:0; display:none; padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; touch-action:manipulation; }
  input { font:inherit; }

  /* join */
  #join { flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; overflow:auto; touch-action:auto; }
  #join h1 { margin:0; font-size:clamp(24px, 7vmin, 40px); }
  #join p { margin:0; color:var(--muted); font-weight:500; }
  #room { width:min(340px, 90vw); padding:12px 16px; border-radius:14px; border:2px solid var(--line); background:var(--panel); color:var(--fg); font-size:28px; letter-spacing:.3em; text-align:center; text-transform:uppercase; touch-action:auto; user-select:text; -webkit-user-select:text; }
  #room[hidden] { display:none; }
  .conn { color:var(--muted); font-size:14px; font-weight:500; }
  .conn.bad { color:var(--p4); }
  #name { width:min(340px, 90vw); padding:14px 16px; border-radius:14px; border:2px solid var(--line); background:var(--panel); color:var(--fg); font-size:20px; text-align:center; touch-action:auto; user-select:text; -webkit-user-select:text; }
  .primary { background:var(--a); color:#08140b; padding:14px 28px; border-radius:14px; font-size:20px; min-width:min(340px, 90vw); }
  .hint { color:var(--muted); font-size:14px; font-weight:500; max-width:420px; }

  /* ports */
  #ports { flex-direction:column; gap:12px; }
  #ports header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #ports h2 { margin:0; font-size:clamp(18px, 5vmin, 28px); }
  #ports .grid { flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; min-height:0; overflow:auto; touch-action:auto; }
  @media (min-aspect-ratio: 3/2) { #ports .grid { grid-template-columns:repeat(4, 1fr); } }
  #ports .grid.many { grid-template-columns:repeat(4, 1fr); gap:8px; grid-auto-rows:minmax(64px, 1fr); }
  .port .win { color:var(--muted); font-size:12px; }
  .port.mine .win { color:#111; }
  #ports .grid.many .port { gap:0; padding:4px; }
  #ports .grid.many .port .n { font-size:clamp(18px, 6vmin, 34px); line-height:1.1; }
  #ports .grid.many .port .who { font-size:12px; white-space:nowrap; }
  .seg button { white-space:nowrap; }
  .port { border-radius:18px; background:var(--panel); border:3px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:8px; min-height:0; }
  .port .n { font-size:clamp(28px, 10vmin, 56px); color:var(--c); }
  .port .who { color:var(--muted); font-size:15px; text-align:center; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .port.free { border-color:var(--c); }
  .port.mine { background:var(--c); color:#111; }
  .port.mine .n, .port.mine .who { color:#111; }
  .port.busy { opacity:.45; }
  .ghost { background:var(--panel); color:var(--fg); padding:10px 14px; border-radius:12px; font-size:15px; }

  /* pad */
  #pad { flex-direction:column; padding-top:max(8px, env(safe-area-inset-top)); }
  .top { display:flex; gap:10px; align-items:stretch; height:calc(var(--s) * .17); min-height:48px; }
  .sh { flex:1; border-radius:28px 28px 12px 12px; background:linear-gradient(#d4d4dc, #9d9daa); color:#3a3a48; display:flex; align-items:center; justify-content:center; font-size:calc(var(--s) * .07); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
  .sh.down { background:linear-gradient(#a9a9b4, #84848f); box-shadow:none; }
  .sh.z { flex:0 0 22%; border-radius:12px; background:linear-gradient(#8b7ff2, var(--z)); color:#fff; }
  .sh.z.down { background:#5546c9; }
  .chip { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 14px; border-radius:14px; background:var(--panel); font-size:clamp(13px, 3.6vmin, 18px); }
  .chip .dot { width:12px; height:12px; border-radius:50%; background:#c33; }
  .chip .dot.on { background:var(--a); }
  .chip b { color:var(--pc); }
  .main { flex:1; display:flex; min-height:0; gap:10px; margin-top:10px; }
  .left, .right { flex:1; position:relative; min-width:0; }
  .right { container-type:size; }
  #stickzone { position:absolute; inset:0; touch-action:none; }
  /* the control stick in its octagonal gate */
  #base { position:absolute; width:min(calc(var(--s) * .52), 92%); aspect-ratio:1; left:50%; top:55%; transform:translate(-50%,-50%); background:#2a2170; clip-path:polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); overflow:visible; }
  #gate { position:absolute; inset:0; pointer-events:none; }
  #knob { position:absolute; width:46%; height:46%; border-radius:50%; background:radial-gradient(circle at 40% 35%, #f0f0f4, #b8b8c4 60%, #8e8e9c); box-shadow:0 0 0 4px rgba(0,0,0,.25), inset 0 0 0 6px rgba(0,0,0,.08); left:50%; top:50%; transform:translate(-50%,-50%); }
  #wheel { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--grey); font-size:clamp(13px, 3.4vmin, 17px); text-align:center; pointer-events:none; }
  #wheel svg { width:calc(var(--s) * .38); height:calc(var(--s) * .38); transition:transform .04s linear; }
  body.gyro #wheel { display:flex; }
  body.gyro #base { opacity:.18; }
  .cluster { position:absolute; right:0; bottom:0; width:min(100cqw, 100cqh, calc(var(--s) * .78)); aspect-ratio:1; }
  @media (orientation: portrait) { .cluster { width:min(100cqw, 100cqh); } }
  .cluster svg { width:100%; height:100%; overflow:visible; }
  .cluster [data-b] { cursor:pointer; }
  .cluster text { font:800 9px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .cluster .down { filter:brightness(1.3); }
  .cluster #A.down circle, .cluster #B.down circle { transform-box:fill-box; transform-origin:center; transform:scale(.93); }

  /* menu */
  #menu { position:absolute; inset:0; background:rgba(0,0,0,.82); display:none; align-items:center; justify-content:center; z-index:5; padding:16px; }
  #menu.on { display:flex; }
  #menu .box { background:var(--panel); border-radius:20px; padding:18px; width:min(420px, 100%); display:flex; flex-direction:column; gap:10px; max-height:100%; overflow:auto; }
  #menu h3 { margin:0 0 4px; }
  .seg { display:flex; background:#111; border-radius:12px; padding:4px; gap:4px; }
  .seg button { flex:1; padding:10px; border-radius:9px; background:transparent; color:var(--muted); }
  .seg button.on { background:#3a3a40; color:var(--fg); }
  #menu .ghost { width:100%; text-align:left; }
  .slider { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 10px; font-size:15px; color:var(--muted); }
  .slider b { color:var(--fg); }
  .slider input { width:100%; accent-color:var(--a); touch-action:auto; }
  #toast { position:absolute; left:50%; top:20%; transform:translateX(-50%); background:#000c; padding:12px 18px; border-radius:12px; display:none; z-index:6; text-align:center; max-width:90vw; }
</style>
</head>
<body>

<section class="screen" id="join">
  <h1>Game Night</h1>
  <p>Mario Kart: Double Dash!!</p>
  <input id="room" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" hidden>
  <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="nickname" enterkeyhint="go">
  <button class="primary" id="go">Los</button>
  <div class="hint" id="installhint"></div>
</section>

<section class="screen" id="ports">
  <header>
    <h2>Hallo <span id="hello"></span>, welcher Spieler?</h2>
    <button class="ghost" id="rename">Name ändern</button>
  </header>
  <div class="conn" id="conn"></div>
  <div class="grid" id="portgrid"></div>
</section>

<section class="screen" id="pad">
  <div class="top">
    <div class="sh" data-b="L">L</div>
    <button class="chip" id="menubtn"><span class="dot" id="dot"></span><span>Spieler <b id="pn">?</b></span><span>☰</span></button>
    <div class="sh z" data-b="Z">Z</div>
    <div class="sh" data-b="R">R</div>
  </div>
  <div class="main">
    <div class="left">
      <div id="stickzone"><div id="base"><div id="knob"></div></div></div>
      <div id="wheel">
        <svg viewBox="0 0 100 100" id="wheelsvg" fill="none" stroke="currentColor" stroke-width="7"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="9" fill="currentColor"/><path d="M8 50h33M59 50h33M50 59v33"/></svg>
        <div>Handy neigen zum Lenken</div>
      </div>
    </div>
    <div class="right">
      <div class="cluster">
        <!-- the GameCube's right side: big green A, red B, kidney-shaped X and Y -->
        <svg viewBox="0 0 100 100">
          <g id="S" data-b="START"><circle cx="12" cy="12" r="7" fill="#8f8fa0"/><circle cx="12" cy="12" r="11" fill="transparent"/><text x="12" y="24" fill="#c3bdf0" style="font-size:5px">START/PAUSE</text></g>
          <g id="Y" data-b="Y"><path d="M25.5 50.6 A31 31 0 0 1 45.4 26.9" fill="none" stroke="transparent" stroke-width="22" stroke-linecap="round"/><path d="M25.5 50.6 A31 31 0 0 1 45.4 26.9" fill="none" stroke="var(--xy)" stroke-width="12" stroke-linecap="round"/><text x="32.3" y="36.6" fill="#55556a">Y</text></g>
          <g id="X" data-b="X"><path d="M73.8 30.6 A31 31 0 0 1 84.1 69.1" fill="none" stroke="transparent" stroke-width="22" stroke-linecap="round"/><path d="M73.8 30.6 A31 31 0 0 1 84.1 69.1" fill="none" stroke="var(--xy)" stroke-width="12" stroke-linecap="round"/><text x="86" y="48" fill="#55556a">X</text></g>
          <g id="B" data-b="B"><circle cx="24" cy="80" r="15" fill="transparent"/><circle cx="24" cy="80" r="11" fill="var(--b)"/><text x="24" y="80.5" fill="#fff">B</text></g>
          <g id="A" data-b="A"><circle cx="56" cy="56" r="21" fill="var(--a)"/><text x="56" y="56.5" fill="#fff" style="font-size:15px">A</text></g>
        </svg>
      </div>
    </div>
  </div>
  <div id="menu">
    <div class="box">
      <h3>Lenken</h3>
      <div class="seg"><button id="m-touch">Touch-Stick</button><button id="m-gyro">Neigen (Gyro)</button></div>
      <button class="ghost" id="m-center">Neigung neu zentrieren</button>
      <label class="slider">Volle Lenkung bei <b id="sensval"></b><input type="range" id="sens" min="6" max="45" step="1"></label>
      <label class="slider">Totzone ausgleichen <b id="dzval"></b><input type="range" id="dz" min="0" max="45" step="1"></label>
      <div class="slider">Lenkausschlag gerade <b id="tiltval">0 %</b></div>
      <button class="ghost" id="m-port">Spieler wechseln</button>
      <button class="ghost" id="m-full">Vollbild</button>
      <button class="ghost" id="m-leave">Aufhören</button>
      <button class="primary" id="m-close">Weiterspielen</button>
    </div>
  </div>
</section>
<div id="toast"></div>

<script>
(() => {
  const BITS = { LEFT:0x0001, RIGHT:0x0002, DOWN:0x0004, UP:0x0008, Z:0x0010, R:0x0020, L:0x0040, A:0x0100, B:0x0200, X:0x0400, Y:0x0800, START:0x1000 };
  const COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('gn.' + k); return v === null ? d : v; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem('gn.' + k, v); } catch (_) {} },
  };
  let clientId = store.get('id', '');
  if (!clientId) { clientId = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('id', clientId); }
  let name = store.get('name', '');
  let wantPort = 0;          // the port we asked for, 1-4 (0 none)
  let myPort = 0;            // the port the server gave us
  let status = null;
  let ws = null;
  let mode = store.get('steer', 'touch');
  const state = { buttons:0 };
  let stickX = 0, stickY = 0, tiltX = 0, tiltZero = null;

  function toast(t, ms) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', ms || 2200); }
  function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }

  // ---- where the game is ----
  // Served by the game itself (/play, /pad) the game is right here. Anywhere else this is
  // the fixed join page: the room code leads to the game's tunnel address, which the game
  // posts to ntfy.sh.
  const HOSTED = !/^\/(play|pad)\/?$/.test(location.pathname);
  const params = new URLSearchParams(location.search);
  let room = (params.get('r') || store.get('room', '')).toUpperCase().replace(/[^A-Z0-9]/g, '');
  // ?s=<address> skips the lookup and goes straight to a game (for testing, or a fixed setup).
  const direct = /^https?:\/\/[\w.:-]+$/.test(params.get('s') || '') ? params.get('s') : '';
  let server = direct || (HOSTED ? '' : location.origin);
  let fails = 0;
  function setConn(t, bad) { const el = $('conn'); el.textContent = t || ''; el.classList.toggle('bad', !!bad); }
  async function lookup() {
    if (!room) return false;
    setConn('Suche Raum ' + room + ' …');
    try {
      const r = await fetch('https://ntfy.sh/mkdd-gn-' + room.toLowerCase() + '/json?poll=1&since=12h', { cache:'no-store' });
      let url = '';
      for (const line of (await r.text()).split('\n')) {
        try { const m = JSON.parse(line); if (m.event === 'message') { const u = JSON.parse(m.message).url; if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)) url = u; } } catch (_) {}
      }
      if (!url) { setConn('Raum ' + room + ' gibt es gerade nicht. Läuft das Spiel?', true); return false; }
      server = url;
      return true;
    } catch (_) { setConn('Keine Verbindung zum Internet?', true); return false; }
  }

  // ---- connection ----
  let connecting = false;
  async function connect() {
    if (connecting) return;
    connecting = true;
    if (HOSTED && !direct && (!server || fails >= 3)) {
      fails = 0;
      if (!(await lookup())) { connecting = false; setTimeout(connect, 4000); return; }
    }
    connecting = false;
    if (!server) return;
    ws = new WebSocket(server.replace(/^http/, 'ws') + '/ws');
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      fails = 0; setConn('');
      $('dot').classList.add('on');
      if (name) ws.send(JSON.stringify({ t:'hello', name, id:clientId }));
      if (name && wantPort) ws.send(JSON.stringify({ t:'take', port:wantPort }));
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.ports) { status = m; renderPorts(); return; }
      if (m.t === 'port') { myPort = m.port; wantPort = m.port; store.set('port', String(myPort)); enterPad(); }
      else if (m.t === 'taken') { toast(portName(m.port) + ' ist schon belegt.'); wantPort = 0; show('ports'); }
      else if (m.t === 'kicked') { myPort = 0; wantPort = 0; toast('Du wurdest am Bildschirm abgemeldet.'); show('ports'); }
      else if (m.t === 'rumble' && navigator.vibrate) navigator.vibrate(m.on ? 2000 : 0);
    };
    ws.onclose = () => {
      $('dot').classList.remove('on');
      fails++;
      if (fails >= 2) setConn('Verbindung weg, versuche es wieder …', true);
      setTimeout(connect, 800);
    };
  }

  // ---- join ----
  $('name').value = name;
  if (HOSTED && !direct) { $('room').hidden = false; $('room').value = room; }
  function join() {
    if (HOSTED && !direct) {
      const r = $('room').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (r.length < 3) { $('room').focus(); return; }
      if (r !== room) { room = r; store.set('room', r); server = ''; if (ws) ws.close(); else connect(); }
    }
    const n = $('name').value.trim();
    if (!n) { $('name').focus(); return; }
    name = n.slice(0, 16); store.set('name', name);
    $('hello').textContent = name;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'hello', name, id:clientId }));
    goFullscreen();
    show('ports');
    renderPorts();
  }
  $('go').onclick = join;
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
  $('room').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('name').focus(); });
  $('rename').onclick = () => { show('join'); $('name').focus(); };

  const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!standalone && ios) $('installhint').textContent = 'Tipp für Vollbild: Teilen-Symbol → „Zum Home-Bildschirm“, dann von dort starten.';

  // ---- ports ----
  // Several game windows (LAN mode): players 5-8 are window 2's players 1-4, and so on.
  const portName = (p) => (status && status.ports.length > 4 ? 'Fenster ' + Math.ceil(p / 4) + ' · ' : '') + 'Spieler ' + ((p - 1) % 4 + 1);
  function renderPorts() {
    const grid = $('portgrid');
    const count = status ? status.ports.length : 4;
    grid.classList.toggle('many', count > 4);
    if (grid.children.length !== count) {
      grid.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const b = document.createElement('button');
        b.className = 'port'; b.style.setProperty('--c', COLORS[(i - 1) % 4]);
        b.innerHTML = (count > 4 ? '<div class="win">Fenster ' + Math.ceil(i / 4) + '</div>' : '') + '<div class="n">' + ((i - 1) % 4 + 1) + '</div><div class="who"></div>';
        b.onclick = () => take(i);
        grid.appendChild(b);
      }
    }
    for (let i = 1; i <= count; i++) {
      const b = grid.children[i - 1];
      const p = status && status.ports[i - 1];
      const phone = p && p.phone;
      const mine = i === myPort;
      const desk = p && p.desktop && p.desktop.length ? p.desktop.join(' + ') : '';
      b.classList.toggle('mine', mine);
      b.classList.toggle('busy', !!phone && !mine);
      b.classList.toggle('free', !phone);
      b.querySelector('.who').textContent = mine ? 'Du' : phone ? phone : desk ? 'frei · auch ' + desk : 'frei';
    }
  }
  function take(port) {
    if (!ws || ws.readyState !== 1) { toast('Noch nicht verbunden …'); return; }
    wantPort = port;
    ws.send(JSON.stringify({ t:'take', port }));
  }

  // ---- pad ----
  function enterPad() {
    $('pn').textContent = status && status.ports.length > 4 ? Math.ceil(myPort / 4) + '·' + ((myPort - 1) % 4 + 1) : myPort;
    document.documentElement.style.setProperty('--pc', COLORS[(myPort - 1) % 4]);
    $('menu').classList.remove('on');
    show('pad');
    wake();
  }
  // Like the runtime does for keyboards and gamepads (src/controls.cpp): the game takes
  // PADClamp's 15 off and then steps in fours (KartGamePad), so steering starts at 19 from
  // the centre and full lock is 75. Any movement at all starts at the first step. The
  // start is set per phone in the menu (dead zone compensation), with the tilt for full lock.
  let deadzone = +store.get('dz2', 19), sens = +store.get('sens', 18);
  function axis(v, lo, hi) {
    v = Math.max(-1, Math.min(1, v));
    const a = Math.abs(v);
    if (a < 0.004) return 128;
    return Math.round(128 + Math.sign(v) * (lo + a * (hi - lo)));
  }
  function packet() {
    const sx = axis(mode === 'gyro' ? tiltX : stickX, deadzone, 75);
    const y = axis(stickY, 33, 69);
    const l = (state.buttons & BITS.L) ? 255 : 0, r = (state.buttons & BITS.R) ? 255 : 0;
    return new Uint8Array([state.buttons & 255, state.buttons >> 8, sx, y, 128, 128, l, r]);
  }
  function send() { if (ws && ws.readyState === 1 && myPort) ws.send(packet()); }
  setInterval(send, 33);

  const counts = {}, held = new Map();
  function press(b, down) {
    counts[b] = (counts[b] || 0) + (down ? 1 : -1);
    const on = counts[b] > 0;
    for (const el of document.querySelectorAll('[data-b="' + b + '"]')) el.classList.toggle('down', on);
    if (on) state.buttons |= BITS[b]; else state.buttons &= ~BITS[b];
    if (down && navigator.vibrate) navigator.vibrate(8);
    send();
  }
  const buttonAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest('[data-b]'); return b ? b.dataset.b : null; };
  $('pad').addEventListener('pointerdown', (e) => {
    if (e.target.closest('#stickzone') || e.target.closest('#menu') || e.target.closest('#menubtn')) return;
    const b = buttonAt(e.clientX, e.clientY); if (!b) return;
    e.preventDefault(); held.set(e.pointerId, b); press(b, true);
  }, { passive:false });
  document.addEventListener('pointermove', (e) => {
    if (!held.has(e.pointerId)) return;
    const now = buttonAt(e.clientX, e.clientY), was = held.get(e.pointerId);
    if (now && now !== was) { press(was, false); press(now, true); held.set(e.pointerId, now); }
  });
  const lift = (e) => { if (!held.has(e.pointerId)) return; press(held.get(e.pointerId), false); held.delete(e.pointerId); };
  document.addEventListener('pointerup', lift);
  document.addEventListener('pointercancel', lift);

  // Stick: where the thumb lands is the centre.
  const zone = $('stickzone'), base = $('base'), knob = $('knob');
  let stickId = null, cx0 = 0, cy0 = 0;
  zone.addEventListener('pointerdown', (e) => {
    if (stickId !== null) return;
    e.preventDefault();
    stickId = e.pointerId; zone.setPointerCapture(stickId);
    const zr = zone.getBoundingClientRect();
    base.style.left = (e.clientX - zr.left) + 'px'; base.style.top = (e.clientY - zr.top) + 'px';
    cx0 = e.clientX; cy0 = e.clientY; moveStick(e);
  }, { passive:false });
  function moveStick(e) {
    const r = base.getBoundingClientRect().width / 2;
    let dx = (e.clientX - cx0) / r, dy = (e.clientY - cy0) / r;
    const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
    stickX = dx; stickY = -dy;
    knob.style.transform = 'translate(calc(-50% + ' + dx * r + 'px), calc(-50% + ' + dy * r + 'px))';
    send();
  }
  zone.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
  const endStick = (e) => {
    if (e.pointerId !== stickId) return;
    stickId = null; stickX = 0; stickY = 0;
    knob.style.transform = 'translate(-50%,-50%)';
    base.style.left = ''; base.style.top = '';
    send();
  };
  zone.addEventListener('pointerup', endStick);
  zone.addEventListener('pointercancel', endStick);

  // ---- tilt ----
  function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
  // The wheel's turn from the device's orientation, for however the phone is held.
  function turnOf(e) {
    const a = ((screenAngle() % 360) + 360) % 360;
    if (a === 90) return e.beta;
    if (a === 270) return -e.beta;
    return e.gamma;  // upright
  }
  window.addEventListener('deviceorientation', (e) => {
    if (mode !== 'gyro' || e.beta == null) return;
    const t = turnOf(e);
    if (tiltZero === null) tiltZero = t;
    let d = t - tiltZero;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    tiltX = Math.max(-1, Math.min(1, d / sens));
    $('tiltval').textContent = Math.round(tiltX * 100) + ' %';
    $('wheelsvg').style.transform = 'rotate(' + (tiltX * 90) + 'deg)';
    send();
  });
  async function setMode(m) {
    if (m === 'gyro') {
      if (!window.isSecureContext) { toast('Neigen geht nur über die Raum-Code-Seite (QR-Code am Bildschirm).', 3500); m = 'touch'; }
      else if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        try { if (await DeviceOrientationEvent.requestPermission() !== 'granted') m = 'touch'; } catch (_) { m = 'touch'; }
      }
    }
    mode = m; store.set('steer', m); tiltZero = null; tiltX = 0;
    document.body.classList.toggle('gyro', m === 'gyro');
    $('m-touch').classList.toggle('on', m === 'touch');
    $('m-gyro').classList.toggle('on', m === 'gyro');
    send();
  }
  $('m-touch').onclick = () => setMode('touch');
  $('m-gyro').onclick = () => setMode('gyro');
  $('m-center').onclick = () => { tiltZero = null; toast('Zentriert'); };
  function showTuning() {
    $('sens').value = sens; $('sensval').textContent = sens + '° Neigung';
    $('dz').value = deadzone; $('dzval').textContent = deadzone ? deadzone + ' (Standard 19)' : 'aus';
  }
  $('sens').oninput = (e) => { sens = +e.target.value; store.set('sens', sens); showTuning(); };
  $('dz').oninput = (e) => { deadzone = +e.target.value; store.set('dz2', deadzone); showTuning(); };
  showTuning();
  $('menubtn').onclick = () => $('menu').classList.add('on');
  $('m-close').onclick = () => $('menu').classList.remove('on');
  $('m-port').onclick = () => { $('menu').classList.remove('on'); show('ports'); renderPorts(); };
  $('m-full').onclick = () => { goFullscreen(); $('menu').classList.remove('on'); };
  $('m-leave').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'leave' })); myPort = 0; wantPort = 0; store.set('port', '0'); $('menu').classList.remove('on'); show('ports'); };
  document.body.classList.toggle('gyro', mode === 'gyro');
  $('m-touch').classList.toggle('on', mode !== 'gyro');
  $('m-gyro').classList.toggle('on', mode === 'gyro');

  // ---- fullscreen, screen on ----
  function goFullscreen() {
    const d = document.documentElement;
    if (d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen({ navigationUI:'hide' }).then(() => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  }
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (_) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

  // ---- start ----
  if (!HOSTED || room || direct) connect();
  if (name && (!HOSTED || room || direct)) {
    $('hello').textContent = name;
    // Back on the same port after a reload or a lost connection.
    wantPort = parseInt(store.get('port', '0'), 10) || 0;
    show('ports');
  } else show('join');
  if (mode === 'gyro' && !window.isSecureContext) setMode('touch');
})();
</script>
</body>
